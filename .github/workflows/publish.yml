name: Publish public slides

'on':
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Enter PUBLISH after reviewing the complete public site
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-slides-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.repository == 'aristo7298sub/public-slides'
          && github.ref == 'refs/heads/main'
          && github.actor == 'aristo7298sub'
          && github.event_name == 'workflow_dispatch'
          && inputs.confirm_publish == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up validation Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Test publication checks
        run: python3 -B scripts/validate_site.py --self-test
      - name: Validate workflow boundaries
        run: python3 -B scripts/validate_site.py --workflow .github/workflows/publish.yml
      - name: Validate the complete public site
        run: python3 -B scripts/validate_site.py site
      - name: Upload to the existing Free Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
