<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何自处？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#FAF7F2;color:#46403A;-webkit-font-smoothing:antialiased}
:root{
  --ink:#46403A;--ink-muted:#8C8277;--paper:#FFFDF9;--bg-wash:#F2ECE1;
  --sage:#5E8573;--sage-wash:rgba(107,144,128,.20);
  --terra:#CE6A52;--terra-wash:rgba(217,107,82,.18);
  --amber:#CF9248;--amber-wash:rgba(224,169,109,.22);
  --slate:#73899B;--slate-wash:rgba(124,144,160,.18);
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif;
  --sans:'Plus Jakarta Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
.page{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 75% 65% at 50% 42%,#FFFDF9 0%,#FAF7F2 62%,#F3ECE0 100%);
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(70,64,58,.045) 1px,transparent 0);background-size:24px 24px}
.page.active{opacity:1;visibility:visible;transition:opacity 1s ease .25s}
.page:not(.active) *{animation-play-state:paused!important}
.stage{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(.8rem,3vh,2.4rem) clamp(1rem,3vw,3rem);cursor:pointer;user-select:none}
.scene-svg{width:100%;height:100%;max-width:1320px;overflow:visible}

.title-card{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.title-card h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,7vw,5.2rem);letter-spacing:.24em;padding-left:.24em;
  opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.4s var(--ease)}
.title-card .rule{margin-top:clamp(1rem,3vh,1.8rem);height:1.5px;width:min(30vw,320px);background:var(--amber);opacity:.7;
  transform:scaleX(0);transition:transform 1.6s var(--ease) .8s}
.title-card.in h1{opacity:1;transform:none}
.title-card.in .rule{transform:scaleX(1)}
.title-card.in.out h1,.title-card.in.out .rule{opacity:0;transition:opacity .6s ease}

.end-title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding-bottom:10vh}
.end-title h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,7.4vw,5.8rem);letter-spacing:.26em;padding-left:.26em;color:var(--ink);
  opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.end-title .rule{margin-top:clamp(1rem,3vh,1.8rem);height:1.5px;width:min(26vw,280px);background:var(--amber);opacity:.7;transform:scaleX(0);transition:transform .6s ease}
.end-title.in h1{opacity:1;transform:none;transition:opacity 2.4s ease 2.2s,transform 2.6s var(--ease) 2.2s}
.end-title.in .rule{transform:scaleX(1);transition:transform 1.8s var(--ease) 3.6s}

.progress{position:fixed;left:0;bottom:0;height:2px;background:rgba(207,146,72,.45);z-index:10;transition:width .6s var(--ease)}
.cue{position:fixed;right:1rem;top:1rem;z-index:20;font-family:var(--sans);font-size:.78rem;color:var(--ink-muted);
  background:rgba(255,253,249,.88);border:1px solid rgba(70,64,58,.12);border-radius:999px;padding:.3rem .8rem;opacity:0;pointer-events:none;transition:opacity .3s}
body.show-cue .cue{opacity:1}
@media (max-width:600px){
  .cue{left:50%;right:auto;top:auto;bottom:clamp(.8rem,3vh,1.3rem);width:max-content;max-width:calc(100vw - 2rem);
    transform:translateX(-50%);font-size:.9rem;line-height:1.45;text-align:center;white-space:normal;opacity:1}
}

/* ---------- SVG primitives ---------- */
.ink{fill:none;stroke:var(--ink);stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.mut{fill:none;stroke:var(--ink-muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sl{fill:none;stroke:var(--slate);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sg{fill:none;stroke:var(--sage);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tr{fill:none;stroke:var(--terra);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.am{fill:none;stroke:var(--amber);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.t-serif{font-family:var(--serif);font-weight:400;letter-spacing:.1em;fill:var(--ink)}
.t-sans{font-family:var(--sans);fill:var(--slate)}
.blk{font-family:var(--serif);font-size:16px;letter-spacing:.1em;fill:var(--ink)}
.fb{transform-box:fill-box;transform-origin:center}
.fbb{transform-box:fill-box;transform-origin:50% 100%}

/* ---------- beat engine ---------- */
.scene{opacity:0;transition:opacity .6s ease;pointer-events:none}
.scene.in{opacity:1;transition:opacity .9s ease .3s}
.scene.in.out{opacity:0;transition:opacity .6s ease}
.fx{opacity:0;transform:translateY(var(--y,10px));transition:opacity .5s ease,transform .7s ease}
.fx.in{opacity:1;transform:none;transition:opacity var(--ft,.9s) ease var(--d,0s),transform 1s var(--ease) var(--d,0s)}
.fx.in.out{opacity:var(--out,0);transition:opacity .9s ease}
.draw{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .5s ease,opacity .4s ease}
.draw.in{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset var(--t,1.4s) cubic-bezier(.45,.05,.25,1) var(--d,0s),opacity .15s linear var(--d,0s)}
.bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);transition:transform .4s ease}
.bar.in{transform:scaleX(1);transition:transform var(--t,1.5s) cubic-bezier(.3,.1,.3,1) var(--d,0s)}

/* loops */
.bob{animation:bob 3.2s ease-in-out infinite}
.beat{animation:beat 1.3s ease-in-out infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.wave-drift{animation:waveDrift 4.5s ease-in-out infinite}
.bubble-rise{animation:rise 4s ease-in infinite}
.drip{animation:drip 1.8s ease-in infinite}
.wobble{animation:wobble 1.6s ease-in-out infinite}
.stomp{animation:stomp 1.8s ease-in-out infinite}
.tremor{animation:tremor 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.steam{animation:steam 3.4s ease-in-out infinite}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.spin{animation:spin 6s linear infinite}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
.paper-fly{animation:paperFly 1.1s ease-in infinite}
.drift{animation:drift 16s ease-in-out infinite}
.float{animation:floatUp 9s ease-in-out infinite}
.glow-up{animation:glowUp 2.6s ease-in-out infinite}

/* page 1 choreography */
.playhead{transition:transform 1.2s var(--ease)}
.tl-label{fill:var(--ink-muted);font-family:var(--serif);font-size:13px;letter-spacing:.06em;transition:fill .5s ease,opacity .5s ease;opacity:.75}
.tl-label.cur{fill:var(--ink);opacity:1;font-weight:500}
.bar-slow.in{transition:transform 5s linear .8s}
.w1.in{animation:w1Trip 8s ease-in-out .4s both}
.w1.in .w1-face{animation:w1Flip 8s linear .4s both}
.belly-fill{opacity:0}
.w1.in .belly-ring{animation:ringOut 8s linear .4s both}
.w1.in .belly-fill{animation:fillIn 8s linear .4s both}
.eat1.in{animation:nibble 8s linear .4s both}
.plusLife,.minusLife{opacity:0}
.plusLife.in{animation:plusLife 8s linear .4s both}
.minusLife.in{animation:minusLife 8s linear .4s both}
.fish5.in{animation:fishLoop 8s ease-in-out .3s both}
.orb5.in{animation:orbLife 8s linear .3s both}
.food1,.food2{opacity:0}
.food1.in{animation:food1 8s ease-in .3s both}
.food2.in{animation:food2 8s ease-in .3s both}
.gauge{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.04)}
.gWant.in{animation:want 8s linear .3s both}
.gLike.in{animation:like 8s linear .3s both}
.dino.in{animation:dinoIn 1.6s ease-out .1s both}
.mouse-run.in{animation:mouseRun 1.6s ease-in-out 4.8s both}
.mouse-run.in .mouse-face{animation:faceLeft .2s linear 4.7s both}
.turn{transform:scaleX(-1)}
.turn.in{animation:turnR .35s ease 3.3s both}
.tagFly{opacity:0}
.tagFly.in{animation:tagFly 1.6s cubic-bezier(.45,.05,.25,1) 3.8s both}
.drain.in{animation:fadeAway 1.2s ease 5.2s both}
.greyIn{opacity:0}
.greyIn.in{animation:fadeIn 1.2s ease 5.2s both}
.stack{transition:transform 1.6s cubic-bezier(.45,.05,.25,1)}
.stack.in{transform:translateX(-350px)}

/* page 2 choreography */
.felt-move{transition:transform 1.6s cubic-bezier(.45,.05,.25,1);transform-origin:744px 440px}
.felt-move.in{transform:translate(200px,90px) scale(.5)}
.walkin.in{animation:walkIn 1.8s ease-out 2.4s both}
.down{transition:transform 1.6s cubic-bezier(.45,.05,.25,1) .3s}
.down1.in{transform:translateY(-10px)}
.down2.in{transform:translateY(40px)}
.down3.in{transform:translateY(90px)}
.swapOut.in{animation:fadeAway .6s ease 1.2s both}
.swapIn{opacity:0}
.swapIn.in{animation:fadeIn .8s ease 1.4s both}

/* keyframes */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(.97)}45%{transform:scale(1.1)}}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes waveDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-120px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes stomp{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}55%{transform:translateY(0)}}
@keyframes tremor{0%,50%{opacity:0;transform:scaleX(.7)}55%{opacity:.6}100%{opacity:0;transform:scaleX(1.5)}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes paperFly{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(52px,40px) rotate(25deg);opacity:0}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
@keyframes glowUp{0%,100%{opacity:0}40%{opacity:.9}}
@keyframes fadeAway{to{opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes w1Trip{0%,14%{transform:translateX(0)}38%,58%{transform:translateX(172px)}100%{transform:translateX(-30px)}}
@keyframes w1Flip{0%,58%{transform:scaleX(1)}62%,100%{transform:scaleX(-1)}}
@keyframes ringOut{0%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes fillIn{0%,44%{opacity:0}50%,100%{opacity:1}}
@keyframes nibble{0%,40%{transform:scaleY(1)}52%,100%{transform:scaleY(.55)}}
@keyframes plusLife{0%,10%{opacity:0}17%,50%{opacity:1}57%,100%{opacity:0}}
@keyframes minusLife{0%,55%{opacity:0}63%,100%{opacity:1}}
@keyframes fishLoop{0%,16%{transform:translateX(0)}30%,36%{transform:translateX(196px)}46%,54%{transform:translateX(60px)}72%,80%{transform:translateX(196px)}100%{transform:translateX(110px)}}
@keyframes orbLife{0%,6%{opacity:.15}11%{opacity:1}24%{opacity:.3}50%{opacity:.15}55%{opacity:1}68%,100%{opacity:.3}}
@keyframes food1{0%,13%{opacity:0;transform:translateY(0)}16%{opacity:1}29%{opacity:1;transform:translateY(108px)}33%,100%{opacity:0;transform:translateY(108px) scale(.2)}}
@keyframes food2{0%,57%{opacity:0;transform:translateY(0)}60%{opacity:1}72%{opacity:1;transform:translateY(108px)}78%,100%{opacity:0;transform:translateY(108px) scale(.2)}}
@keyframes want{0%,12%{transform:scaleY(.04)}29%,36%{transform:scaleY(.42)}50%{transform:scaleY(.12)}56%{transform:scaleY(.94)}72%{transform:scaleY(.88)}100%{transform:scaleY(.82)}}
@keyframes like{0%,29%{transform:scaleY(.04)}34%{transform:scaleY(.52)}48%,73%{transform:scaleY(.2)}78%{transform:scaleY(.38)}100%{transform:scaleY(.24)}}
@keyframes dinoIn{from{transform:translateX(220px);opacity:0}to{transform:none;opacity:1}}
@keyframes mouseRun{to{transform:translateX(-140px)}}
@keyframes faceLeft{to{transform:scaleX(-1)}}
@keyframes turnR{from{transform:scaleX(-1)}to{transform:scaleX(1)}}
@keyframes tagFly{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1;transform:translate(0,0) scale(1)}45%{transform:translate(0,0) scale(1)}100%{opacity:1;transform:translate(106px,92px) rotate(-8deg) scale(.9)}}
@keyframes walkIn{from{transform:translateX(-240px);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;
    transition-duration:.15s!important;transition-delay:0s!important}
}
</style>
</head>

            <ellipse cx="465" cy="332" rx="6" ry="4.5" fill="var(--ink)" transform="rotate(-20 465 332)"/><ellipse cx="485" cy="326" rx="6" ry="4.5" fill="var(--ink)" transform="rotate(-20 485 326)"/></g>

</section>

<div class="progress" id="progress"></div>
<div class="cue" id="cue"></div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const pages = [...document.querySelectorAll('.page')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* generated: AI output pile */
  document.querySelectorAll('.pile').forEach(g => {
    const o = g.dataset;
    for (let i = 0; i < +o.n; i++) {
      const r = document.createElementNS(NS, 'rect');
      Object.entries({ x: +o.x + (i % 3 - 1) * 2, y: +o.y - (i + 1) * 10, width: 40, height: 8, rx: 2, fill: '#FFFDF9', stroke: '#8C8277', 'stroke-width': 1.2 })
        .forEach(([k, v]) => r.setAttribute(k, v));
      r.setAttribute('class', 'fx');
      r.style.setProperty('--d', (+o.d0 + i * +o.step) + 's');
      g.appendChild(r);
    }
  });

  /* beat ownership */
  document.querySelectorAll('.fx, .draw, .bar').forEach(el => {
    if (!el.dataset.at) {
      const owner = el.parentElement.closest('[data-at]');
      el.dataset.at = owner ? owner.dataset.at : '1';
    }
  });

  /* timeline playhead (page 1) */
  const playhead = document.getElementById('playhead');
  const tlLabels = [...document.querySelectorAll('.tl-label')];
  const stageOf = b => b <= 3 ? -1 : b <= 8 ? b - 4 : 5;
  function setTimeline(b, stepForward) {
    const s = stageOf(b);
    tlLabels.forEach(l => l.classList.toggle('cur', +l.dataset.stage === s));
    const x = s < 0 ? 0 : s * 150;
    if (b === 3 && stepForward && !reduced) {
      playhead.style.transition = 'none';
      playhead.style.transform = 'translateX(750px)';
      void playhead.getBoundingClientRect();
      playhead.style.transition = 'transform 2.8s cubic-bezier(.6,0,.3,1) 1s';
      playhead.style.transform = 'translateX(0px)';
    } else {
      playhead.style.transition = '';
      playhead.style.transform = `translateX(${x}px)`;
    }
  }

  const cues = [
    ['标题 · 如何自处？', 'AI 三秒交卷，我心里打鼓', '倒带：回到六亿年前',
     '① 同一团气味，饿时是 +，饱时是 −', '② 灯一亮就“想要”，吃到时只是“喜欢”', '③ 先在脑中的另一个世界里试一遍',
     '④ 我想象的你，长着我的脸', '⑤ 语言传递世界，也把人压成一个词', '这一切长在同一个活的身体上'],
    ['伽利略：一只苹果，两种性质', '四百年：只量得出来的一路狂飙', '一切都有了分数，连人也是', '排行榜：谁是更好的人？',
     '台阶消失：什么才算更好的一个人？', '如何自处？']
  ];

  let P = 0, B = 1;
  function apply(stepForward) {
    pages.forEach((pg, i) => {
      const active = i === P;
      pg.classList.toggle('active', active);
      pg.setAttribute('aria-hidden', String(!active));
    });
    const page = pages[P];
    page.querySelectorAll('[data-at]').forEach(el => el.classList.toggle('in', B >= +el.dataset.at));
    page.querySelectorAll('[data-on]').forEach(el => el.classList.toggle('in', B >= +el.dataset.on));
    page.querySelectorAll('[data-out]').forEach(el => el.classList.toggle('out', B >= +el.dataset.out));
    if (P === 0) setTimeline(B, stepForward);
    const total = pages.reduce((s, p) => s + +p.dataset.beats, 0);
    const done = pages.slice(0, P).reduce((s, p) => s + +p.dataset.beats, 0) + B;
    document.getElementById('progress').style.width = (done / total * 100) + '%';
    document.getElementById('cue').textContent = `${P + 1}.${B}  ${cues[P][B - 1]}`;
    history.replaceState(null, '', `#${P + 1}-${B}`);
  }
  function next() {
    if (B < +pages[P].dataset.beats) B++;
    else if (P < pages.length - 1) { P++; B = 1; }
    else return;
    apply(true);
  }
  function prev() {
    if (B > 1) B--;
    else if (P > 0) { P--; B = +pages[P].dataset.beats; }
    else return;
    apply(false);
  }
  window.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { P = 0; B = 1; apply(false); }
    else if (e.key === 'End') { P = pages.length - 1; B = +pages[P].dataset.beats; apply(false); }
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-cue');
    else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  });
  document.addEventListener('click', e => { if (e.button === 0) next(); });
  document.addEventListener('contextmenu', e => { e.preventDefault(); prev(); });
  let tx = null;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) (dx < 0 ? next : prev)();
    tx = null;
  });
  function readHash() {
    const m = location.hash.match(/^#(\d+)-(\d+)$/);
    if (!m) return false;
    P = Math.min(Math.max(+m[1] - 1, 0), pages.length - 1);
    B = Math.min(Math.max(+m[2], 1), +pages[P].dataset.beats);
    return true;
  }
  window.addEventListener('hashchange', () => { if (readHash()) apply(false); });
  readHash();
  apply(false);
})();
</script>
